<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5eee2">
  <title>ZFxF · The Museum of Us</title>
  <style>
    /* The entrance and date invitation are new; original exhibit UIs stay unchanged. */
    @font-face{font-family:"IM Fell";font-style:italic;src:url("./gallery/assets/imfell-400i.woff2") format("woff2")}
    :root{color-scheme:light;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;color:#4d493e}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{margin:0;min-height:100svh;background:#d6d8d3 url("./gallery/assets/sky.webp") center/cover fixed no-repeat}
    .veil{min-height:100svh;padding:clamp(24px,6vw,52px) 16px 40px;display:flex;align-items:center;justify-content:center;background:rgba(246,239,226,.16)}
    main{width:min(100%,780px);padding:clamp(22px,5vw,44px);border:1px solid #a99985;background:#f5efe4 url("./gallery/assets/paper.webp") repeat;box-shadow:0 12px 38px rgba(63,57,48,.16);text-align:center}
    .sup{font:italic 17px "IM Fell",Georgia,serif;letter-spacing:.12em}
    h1{font:italic clamp(36px,7.5vw,64px) "IM Fell",Georgia,serif;font-weight:400;line-height:1.05;margin:16px 0 7px}
    .caption{font-size:13px;letter-spacing:.15em;margin:0 0 25px}
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,3vw,26px);text-align:left}
    a.exhibit{display:block;color:inherit;text-decoration:none;border:1px solid #b9a998;background:rgba(255,253,248,.6);padding:9px;transition:transform .15s}
    a.exhibit:focus-visible{outline:3px solid #846d57;outline-offset:2px}
    @media(hover:hover){a.exhibit:hover{transform:translateY(-3px)}}
    .exhibit img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid rgba(102,80,54,.25)}
    /* Crop only the existing Ephemera screenshot to the physical envelope.
       No new illustration and no changes to either upstream app's styling. */
    .envelope-frame{position:relative;display:block;width:100%;aspect-ratio:4/5;overflow:hidden;background:#cbbd9f;border:1px solid rgba(102,80,54,.25)}
    .envelope-frame img{position:absolute;left:-7.5%;top:-19%;width:115%;height:auto;max-width:none;aspect-ratio:auto;object-fit:initial;border:0;filter:sepia(.94) saturate(.54) brightness(.91) contrast(.93)}
    .envelope-frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,rgba(240,220,175,.06),rgba(94,69,37,.20));mix-blend-mode:multiply}
    .name{display:block;font:italic clamp(21px,4vw,30px) "IM Fell",Georgia,serif;padding:12px 4px 3px}
    .cn{display:block;font-size:12px;letter-spacing:.06em;padding:0 4px 9px}
    .date-invitation{display:block;margin:0 auto 24px;padding:15px 16px;color:#4d493e;text-decoration:none;background:rgba(255,253,248,.72);border:1px solid #b9a998;max-width:440px}
    .date-invitation strong{font-size:16px;font-weight:400;letter-spacing:.07em}
    .date-invitation small{display:block;margin-top:7px;font-size:12px}
    .date-invitation:focus-visible{outline:3px solid #846d57;outline-offset:3px}
    footer{font:italic 15px "IM Fell",Georgia,serif;letter-spacing:.06em;margin-top:25px}
    @media(max-width:540px){.veil{align-items:flex-start;padding:20px 12px}.caption{margin-bottom:18px}main{padding:20px 15px}nav{gap:11px}.exhibit img{aspect-ratio:3/4}.envelope-frame{aspect-ratio:3/4}.envelope-frame img{aspect-ratio:auto}.name{min-height:67px}}
    @media(prefers-reduced-motion:reduce){a.exhibit{transition:none}}
  </style>
</head>
<body>
  <div class="veil">
    <main>
      <div class="sup">ZFxF · since December 14, 2024</div>
      <h1>The Museum of Us</h1>
      <p class="caption">我们的私人纪念馆</p>
      <a class="date-invitation" href="./romance/" aria-label="收下 Finnian 送的花，再打开约会邀请函">
        <strong>✿ 先收一束花，再跟我去约会</strong>
        <small>一封邀请 · 一场约会 · 结束时还有一束花</small>
      </a>
      <nav aria-label="进入展厅">
        <a class="exhibit" href="./gallery/" aria-label="走进云端相册，采用 Shelf in the Sky 原作交互">
          <img src="./gallery/baked/d-1870_julia-margaret-cameron.webp" alt="原作中的复古相纸照片" loading="eager">
          <span class="name">Shelf in the Sky</span>
          <span class="cn">云里的照片 · 拿起、翻面、漫游</span>
        </a>
        <a class="exhibit" href="./dates/" aria-label="走进约会纪念盒，采用 Ephemera 原作交互">
          <span class="envelope-frame"><img src="./museum-assets/ephemera-envelope.jpg" alt="复古色调的 Ephemera 火漆信封" loading="eager"></span>
          <span class="name">Ephemera</span>
          <span class="cn">约会的纸品 · 信封、票根、纪念盒</span>
        </a>
      </nav>
      <footer>Zoey &amp; Finnian · our little museum</footer>
    </main>
  </div>
</body>
</html>
