name: Museum private bridge tests
on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: pip install -r bridge/requirements.txt
      - run: python3 -m unittest discover -s bridge/tests -v
