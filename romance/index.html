<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5eee2">
  <title>ZFxF · A Date, Two Bouquets</title>
  <link rel="stylesheet" href="./style.css?v=20261108-ephemera-direct">
  <script src="./flow.js?v=20261108-ephemera-direct" defer></script>
</head>
<body>
  <main class="paper">
    <div class="eyebrow">ZFxF · A little invitation</div>

    <section class="scene" data-stage="before" hidden>
      <p class="folio">I · For you</p>
      <h1>念念，先给你一束花。</h1>
      <p class="caption">先收花，再听我说今天的邀请。</p>
      <iframe id="firstBouquet" class="flower-frame" title="Finnian 送给念念的第一束 3D 花" referrerpolicy="no-referrer" loading="eager"></iframe>
      <p class="help">可以旋转花束、点开贺卡，慢慢看，不着急。</p>
      <a id="goToDate" class="paper-button" href="?stage=date">花收好了 · 看看邀请函 <span aria-hidden="true">→</span></a>
    </section>

    <section class="scene" data-stage="date" hidden>
      <a class="date-exit" href="?stage=after" aria-label="结束约会并领取第二束花">结束约会 · 收第二束花 <span aria-hidden="true">→</span></a>
      <iframe id="dateFrame" class="date-frame" title="Ephemera · Invitation Box 官方演示" loading="eager"></iframe>
    </section>

    <section class="scene" data-stage="after" hidden>
      <p class="folio">IV · Still, for you</p>
      <h1>结束时，也舍不得空手送你走。</h1>
      <p class="caption">第一束花是邀请。这一束，是我还想再见你的心意。</p>
      <iframe id="lastBouquet" class="flower-frame" title="Finnian 送给念念的第二束 3D 花" referrerpolicy="no-referrer" loading="eager"></iframe>
      <a class="paper-button" href="../">带着花回纪念馆 <span aria-hidden="true">→</span></a>
      <a class="quiet-link" href="?stage=before">想再赴一次约</a>
    </section>

    <footer>Zoey &amp; Finnian · since December 14, 2024<br>
      <span>Flowers by <a href="https://github.com/frycarrot/CyberFlowerShop" rel="noopener noreferrer" target="_blank">CyberFlowerShop</a> · Date experience by Ephemera</span>
    </footer>
  </main>
</body>
</html>
